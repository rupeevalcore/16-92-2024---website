<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Diagnostic Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        h2 {
            color: #0066cc;
        }

        .status {
            padding: 15px;
            margin: 15px 0;
            border-radius: 4px;
            font-weight: bold;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        .info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        button {
            background: #0066cc;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }

        button:hover {
            background: #0052a3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .log {
            background: #fff;
            border: 1px solid #ddd;
            padding: 15px;
            margin-top: 20px;
            border-radius: 4px;
            max-height: 300px;
            overflow-y: auto;
        }

        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid #eee;
            font-size: 13px;
        }

        .log-entry:last-child {
            border-bottom: none;
        }
    </style>
</head>

<body>
    <h2>🔍 Chatbot Diagnostic Test</h2>

    <div class="status info">
        <strong>Apps Script URL:</strong><br>
        <small>https://script.google.com/macros/s/AKfycbyArVVqN3gPnX7QPsQgytlyQPlD-_haeVqbznj-U6A87tyNqeiqj4GX151c-rsm-ktThw/exec</small>
    </div>

    <div id="statusMessage"></div>

    <form id="testForm">
        <div class="form-group">
            <label for="name">Name *</label>
            <input type="text" id="name" name="name" value="Test User" required>
        </div>

        <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" value="test@example.com" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone *</label>
            <input type="tel" id="phone" name="phone" value="+91 9999999999" required>
        </div>

        <div class="form-group">
            <label for="message">Message *</label>
            <textarea id="message" name="message" rows="3"
                required>This is a test message to verify Google Sheet integration.</textarea>
        </div>

        <button type="submit" id="submitBtn">🧪 Send Test Data</button>
    </form>

    <div class="log">
        <strong>📋 Diagnostic Log:</strong>
        <div id="logContainer"></div>
    </div>

    <script>
        const logContainer = document.getElementById('logContainer');
        const statusMessage = document.getElementById('statusMessage');

        function addLog(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<strong>${new Date().toLocaleTimeString()}:</strong> ${message}`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function showStatus(message, type) {
            statusMessage.innerHTML = `<div class="status ${type}">${message}</div>`;
        }

        addLog('🟢 Page loaded successfully', 'success');

        document.getElementById('testForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Sending...';

            addLog('📤 Starting form submission...');

            try {
                const scriptURL = 'https://script.google.com/macros/s/AKfycbyArVVqN3gPnX7QPsQgytlyQPlD-_haeVqbznj-U6A87tyNqeiqj4GX151c-rsm-ktThw/exec';

                const formData = {
                    name: document.getElementById('name').value,
                    email: document.getElementById('email').value,
                    phone: document.getElementById('phone').value,
                    message: document.getElementById('message').value
                };

                addLog(`📋 Form data: ${JSON.stringify(formData)}`);

                const params = new URLSearchParams();
                params.append('name', formData.name);
                params.append('email', formData.email);
                params.append('phone', formData.phone);
                params.append('message', formData.message);

                addLog('🌐 Sending request to Google Apps Script...');

                const response = await fetch(scriptURL, {
                    method: 'POST',
                    body: params,
                    mode: 'no-cors'
                });

                addLog('✅ Request sent successfully (mode: no-cors)');
                addLog('⚠️ Note: With no-cors mode, we cannot read the response');
                addLog('🔍 Please check your Google Sheet manually');

                showStatus('✅ Data sent! Check your Google Sheet to verify it was saved.', 'success');

                setTimeout(() => {
                    submitBtn.disabled = false;
                    submitBtn.textContent = '🧪 Send Test Data';
                }, 2000);

            } catch (error) {
                addLog(`❌ Error: ${error.message}`, 'error');
                showStatus(`❌ Error: ${error.message}`, 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = '🧪 Send Test Data';
            }
        });

        // Test fetch availability
        if (typeof fetch === 'undefined') {
            addLog('❌ Fetch API not available', 'error');
        } else {
            addLog('✅ Fetch API available', 'success');
        }
    </script>
</body>

</html>
